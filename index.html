<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Try</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
        }
        a {
            color: #0066cc;
            text-decoration: none;
            padding: 8px 12px;
            background-color: #fff;
            border-radius: 4px;
            display: inline-block;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #e6f2ff;
        }
        .no-files {
            color: #999;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Site Index</h1>
    <div id="file-list">
        <p>Loading files...</p>
    </div>

    <script>
        async function loadHTMLFiles() {
            try {
                // Fetch the directory listing
                const response = await fetch('./');
                const html = await response.text();
                
                // Parse HTML to find all .html files
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const links = doc.querySelectorAll('a');
                
                const htmlFiles = Array.from(links)
                    .map(link => link.getAttribute('href'))
                    .filter(href => href && href.endsWith('.html') && href !== 'index.html')
                    .sort();
                
                // Display the files
                const fileList = document.getElementById('file-list');
                
                if (htmlFiles.length === 0) {
                    fileList.innerHTML = '<p class="no-files">No HTML files found in this directory.</p>';
                } else {
                    const ul = document.createElement('ul');
                    htmlFiles.forEach(file => {
                        const li = document.createElement('li');
                        const a = document.createElement('a');
                        a.href = file;
                        a.textContent = file;
                        li.appendChild(a);
                        ul.appendChild(li);
                    });
                    fileList.innerHTML = '';
                    fileList.appendChild(ul);
                }
            } catch (error) {
                document.getElementById('file-list').innerHTML = 
                    '<p class="no-files">Error loading files. Make sure directory listing is enabled on your server.</p>';
                console.error('Error:', error);
            }
        }
        
        // Load files when page loads
        loadHTMLFiles();
    </script>
</body>
</html>
