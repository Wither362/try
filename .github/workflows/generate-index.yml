name: Generate Index

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate HTML index
        run: |
          python3 << 'EOF'
          import os
          import glob
          
          files = sorted([f for f in glob.glob('*.html') if f != 'index.html'])
          
          html = '''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Site Index</title>
              <style>
                  body { font-family: Arial; max-width: 800px; margin: 50px auto; padding: 20px; }
                  h1 { color: #333; }
                  a { display: block; margin: 10px 0; color: #0066cc; text-decoration: none; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <h1>Site Index</h1>
              <ul>
          '''
          
          for file in files:
              html += f'<li><a href="{file}">{file}</a></li>\n'
          
          html += '''      </ul>
          </body>
          </html>'''
          
          with open('index.html', 'w') as f:
              f.write(html)
          EOF
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html
          git commit -m "Auto-generate index" || true
          git push
